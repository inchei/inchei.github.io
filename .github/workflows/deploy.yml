name: Deploy Zola site to GitHub Pages

on:
  push:
    branches: [main, master]
  repository_dispatch:
    types: [memos]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola 0.23.6
        run: |
          curl -sSL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz -o /tmp/zola.tar.gz
          tar xzf /tmp/zola.tar.gz -C /tmp
          sudo mv /tmp/zola /usr/local/bin/zola
          zola --version

      - name: Build
        working-directory: .
        run: |
          zola build
          node scripts/wordjoin.cjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
